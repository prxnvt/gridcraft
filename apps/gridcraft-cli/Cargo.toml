[package]
name = "gridcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft command line: inspect, convert, evaluate, script and serve MCP without a window"
publish = false

[lints]
workspace = true

[[bin]]
name = "gridcraft-cli"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { workspace = true }
# The app binary doubles as the sandboxed Python worker (`--python-worker`).
gridcraft-python = { workspace = true, features = ["python"] }
gridcraft-mcp = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
